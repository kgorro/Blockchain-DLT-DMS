services:
  # MongoDB instances
  mongo1:
    image: mongo:7.0
    container_name: blockchain-mongo-1
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - blockchain-network

  mongo2:
    image: mongo:7.0
    container_name: blockchain-mongo-2
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - blockchain-network

  mongo3:
    image: mongo:7.0
    container_name: blockchain-mongo-3
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - blockchain-network

  # Blockchain nodes
  node1:
    build: ./node
    container_name: blockchain-node-1
    environment:
      - PORT=5001
      - P2P_PORT=6001
      - NODE_ID=node-1
      - NODE_TYPE=authority     # ✅ ONLY THIS NODE MINES
      - MONGODB_URI=mongodb://mongo1:27017/blockchain-node1
      - BOOTSTRAP_PEERS=
    ports:
      - "5001:5001"
      - "6001:6001"
    volumes:
      - ./uploads1:/app/uploads
    depends_on:
      - mongo1
    networks:
      - blockchain-network
    restart: unless-stopped

  node2:
    build: ./node
    container_name: blockchain-node-2
    environment:
      - PORT=5002
      - P2P_PORT=6002
      - NODE_ID=node-2
      - NODE_TYPE=authority
      - MONGODB_URI=mongodb://mongo2:27017/blockchain-node2
      - BOOTSTRAP_PEERS=ws://node1:6001
    ports:
      - "5002:5002"
      - "6002:6002"
    volumes:
      - ./uploads2:/app/uploads
    depends_on:
      - mongo2
      - node1
    networks:
      - blockchain-network
    restart: unless-stopped

  node3:
    build: ./node
    container_name: blockchain-node-3
    environment:
      - PORT=5003
      - P2P_PORT=6003
      - NODE_ID=node-3
      - NODE_TYPE=validator     # ✅ CHANGED: Only validates
      - MONGODB_URI=mongodb://mongo3:27017/blockchain-node3
      - BOOTSTRAP_PEERS=ws://node1:6001,ws://node2:6002
    ports:
      - "5003:5003"
      - "6003:6003"
    volumes:
      - ./uploads3:/app/uploads
    depends_on:
      - mongo3
      - node1
      - node2
    networks:
      - blockchain-network
    restart: unless-stopped

  # Frontend UI
  frontend:
    build: ./frontend
    container_name: blockchain-frontend
    ports:
      - "80:80"
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - blockchain-network
    restart: unless-stopped

networks:
  blockchain-network:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: