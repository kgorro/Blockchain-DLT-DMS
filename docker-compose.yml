version: '3.8'

services:
  # MongoDB instances
  mongo1:
    image: mongo:7.0
    container_name: blockchain-mongo-1
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - blockchain-network
    restart: unless-stopped

  mongo2:
    image: mongo:7.0
    container_name: blockchain-mongo-2
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - blockchain-network
    restart: unless-stopped

  mongo3:
    image: mongo:7.0
    container_name: blockchain-mongo-3
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - blockchain-network
    restart: unless-stopped

  # Blockchain nodes
  node1:
    build: 
      context: ./node
      dockerfile: Dockerfile
    container_name: blockchain-node-1
    environment:
      - PORT=5001
      - P2P_PORT=6001
      - NODE_ID=node-1
      - NODE_TYPE=authority
      - MONGODB_URI=mongodb://mongo1:27017/blockchain-node1
      - BOOTSTRAP_PEERS=
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - NODE_ENV=development
    ports:
      - "5001:5001"
      - "6001:6001"
    volumes:
      # - ./node:/app
      # - /app/node_modules  # Prevent host node_modules from overwriting container
      - ./uploads1:/app/uploads
    depends_on:
      - mongo1
    networks:
      - blockchain-network
    restart: unless-stopped
    # Increase memory limit for OCR processing
    deploy:
      resources:
        limits:
          memory: 2G

  node2:
    build: 
      context: ./node
      dockerfile: Dockerfile
    container_name: blockchain-node-2
    environment:
      - PORT=5002
      - P2P_PORT=6002
      - NODE_ID=node-2
      - NODE_TYPE=authority
      - MONGODB_URI=mongodb://mongo2:27017/blockchain-node2
      - BOOTSTRAP_PEERS=ws://node1:6001
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - NODE_ENV=development
    ports:
      - "5002:5002"
      - "6002:6002"
    volumes:
      # - ./node:/app
      # - /app/node_modules
      - ./uploads2:/app/uploads
    depends_on:
      - mongo2
      - node1
    networks:
      - blockchain-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  node3:
    build: 
      context: ./node
      dockerfile: Dockerfile
    container_name: blockchain-node-3
    environment:
      - PORT=5003
      - P2P_PORT=6003
      - NODE_ID=node-3
      - NODE_TYPE=authority  # Changed back to authority for 3-node consensus
      - MONGODB_URI=mongodb://mongo3:27017/blockchain-node3
      - BOOTSTRAP_PEERS=ws://node1:6001,ws://node2:6002
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - NODE_ENV=development
    ports:
      - "5003:5003"
      - "6003:6003"
    volumes:
      # - ./node:/app
      # - /app/node_modules
      - ./uploads3:/app/uploads
    depends_on:
      - mongo3
      - node1
      - node2
    networks:
      - blockchain-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # Frontend UI
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blockchain-frontend
    ports:
      - "80:80"
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - blockchain-network
    restart: unless-stopped

networks:
  blockchain-network:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: